version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: encurtador_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: encurtador
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: encurtador_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data: